name: CI

# Free-only: no secrets, no API keys, no LLM calls, no paid actions.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Pinned exactly; bump deliberately. validate needs no credentials.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.322
      - name: Validate plugin and marketplace manifests
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" claude plugin validate .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Lint tracked shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  installer:
    name: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test install.sh and uninstall.sh
        run: bash tests/install_test.sh

  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check relative links and anchors in Markdown (offline)
        run: python3 -I tests/check_links.py

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test the guardrail hook
        run: bash tests/hooks_test.sh
